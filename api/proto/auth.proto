syntax = "proto3";

package hcp.auth.v1;

option go_package = "github.com/fffeng99999/hcp-server/api/generated/auth";

service AuthService {
  rpc Login(LoginRequest) returns (LoginResponse);
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message User {
  string id = 1;
  string username = 2;
  string role = 3;
  string email = 4;
  string created_at = 5;
  string status = 6;
  string last_login = 7;
}

message LoginResponse {
  User user = 1;
}

